services:
  postgres:
    image: pgvector/pgvector:pg16-trixie # postgres 16 + pgvector có sẵn
    container_name: calories_tracker
    restart: always
    environment:
      POSTGRES_DB: calories_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Chạy lần đầu (data dir trống) sẽ tạo extension/schema rag + role rag_reader.
      # DB đã tồn tại từ trước -> chạy thủ công: psql ... -f rag-service/scripts/init_db.sql
      - ./rag-service/scripts/init_db.sql:/docker-entrypoint-initdb.d/10-rag-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d calories_tracker" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: calories_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka KRaft 1 node (không cần Zookeeper). Event bus cho Notification Service.
  # - Trong docker network: kafka:9092
  # - Từ host (backend chạy `npm run start:dev`): localhost:9094  -> KAFKA_BROKERS
  kafka:
    image: apache/kafka:3.7.0
    container_name: calories_kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: vitalai-kafka-cluster-1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: calories_rag
    restart: unless-stopped
    env_file:
      - ./rag-service/.env
    ports:
      - "8001:8001"
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # DB: FastAPI dùng user read-only rag_reader (đọc business, ghi schema rag)
      POSTGRES_URL: postgresql+asyncpg://rag_reader:ragpass@postgres:5432/calories_tracker
      RAG_SCHEMA: rag
      REDIS_URL: redis://redis:6379/1
      # LLM/Embedding keys and model settings are loaded from ./rag-service/.env.
      # Do not override OPENAI_API_KEY here: an empty Compose interpolation would
      # force StubLLM even when rag-service/.env contains a valid key.
      # Secret nội bộ — phải khớp RAG_INTERNAL_SECRET bên backend/.env
      NESTJS_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:-dev-secret-change-in-prod}
    volumes:
      - rag_hf_cache:/data/hf # cache model embedding (tải 1 lần)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ───────────────────── Food AI (computer vision) ──────────────────
  # FastAPI service: photo -> YOLOv8-seg + nateraw/food + Depth-Anything-V2
  # -> [{food_title, volume_cm3}]. Backend maps volume->grams->nutrition.
  # food-ai-service:
  #   build:
  #     context: ./calories_tracker_service
  #     dockerfile: Dockerfile
  #   container_name: calories_food_ai
  #   restart: unless-stopped
  #   environment:
  #     DEVICE: cpu
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - food_ai_hf_cache:/data/hf # cache HF model weights (tải 1 lần)
  #   healthcheck:
  #     test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s # model load on CPU is slow

  # ───────────────────────── Backend NestJS ─────────────────────────
  # Gateway/Business/Source-of-truth. Đọc secrets từ backend/.env (env_file).
  # Backend DB dùng DATABASE_URL Supabase trong backend/.env; Postgres container
  # phía trên vẫn giữ cho rag-service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calories_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3005
      # Hạ tầng nội bộ ngoài database backend.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      RAG_SERVICE_URL: http://rag-service:8001
      # Food AI service trong cùng docker network.
      # FOOD_AI_SERVICE_URL: http://food-ai-service:8000
      # Service-account Firebase được mount read-only ở /app/secret
      FIREBASE_SERVICE_ACCOUNT_PATH: ./secret/calories-tracker-mobile-firebase-adminsdk-fbsvc-b641a8db8e.json
    ports:
      - "3005:3005"
    volumes:
      - ./backend/secret:/app/secret:ro # khóa Firebase (không bake vào image)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rag-service:
        condition: service_started
      # food-ai-service:
      #   condition: service_started

volumes:
  # Dùng lại volume data đã có từ stack cũ (DACN/Project) để KHÔNG mất dữ liệu
  # (39 users, schema rag...). Nếu muốn DB mới tinh: bỏ external + name đi.
  postgres_data:
    external: true
    name: project_postgres_data
  rag_hf_cache:
  food_ai_hf_cache:
  kafka_data:

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: calories_tracker
    restart: always
    environment:
      POSTGRES_DB: calories_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: calories_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   # GPU support (uncomment if you have NVIDIA GPU):
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: calories_rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Switch to "gemini" for production
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
      POSTGRES_URL: postgresql+asyncpg://rag_reader:${RAG_DB_PASSWORD:-ragpass}@postgres:5432/calories_tracker
      CHROMA_PERSIST_DIR: /data/chroma
      NESTJS_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET:-dev-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - rag_chroma_data:/data/chroma
    depends_on:
      - postgres
      # - ollama

volumes:
  postgres_data: # ollama_models:

  rag_chroma_data:
